  </video>  -->

  <div class="video-overlay">
    <nav class="navbar">
      <a routerLink="/home" class="nav-link">Home</a>
     <a routerLink="/cart" class="nav-link" target="_self">Cart</a>


    </nav>

    <h1 class="welcome-text">Welcome to TechZone 🛒</h1>
    <button class="shop-btn" (click)="scrollToProducts()">Shop Now</button>
  </div>
</div>

<section id="products-section" class="products-section">
  <h2 class="text-center mt-5 mb-4">Our Electronics Products</h2>
  <div class="container">
    <div class="row">
      <div *ngFor="let product of products" class="col-md-4 mb-4">
        <div class="card h-100">
          <img [src]="product.image" class="card-img-top" alt="{{ product.title }}">
          <div class="card-body">
            <h5 class="card-title">{{ product.title }}</h5>
            <p class="card-text">{{ product.description | slice:0:100 }}...</p>
            <p class="card-text"><strong>${{ product.price }}</strong></p>

            <div class="rating">
              <ng-container *ngFor="let star of [1,2,3,4,5]">
                <span [ngClass]="{
                  'filled-star': star <= product.rating.rate,
                  'empty-star': star > product.rating.rate
                }">★</span>
              </ng-container>
              <small>({{ product.rating.count }} reviews)</small>
            </div>

            <div class="mt-3">
              <button (click)="addToCart(product)" class="btn btn-success me-2">Add to Cart</button>
              <button (click)="goToDetails(product.id)" class="btn btn-outline-primary">View Details</button>
            </div>

            <p [ngStyle]="{ color: product.stock === 0 ? 'red' : 'green' }">
              {{ product.stock === 0 ? 'Out of Stock' : 'In Stock' }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
